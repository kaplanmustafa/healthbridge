name: iOS CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    # GitHub-hosted macOS runner, no Apple signing secrets needed for simulator.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          ID="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild -project HealthBridge.xcodeproj -scheme HealthBridge -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" -derivedDataPath "$RUNNER_TEMP/HealthBridgeDerivedData" CODE_SIGNING_ALLOWED=NO test
